# /etc/postgresql/16/main/conf.d/crp.conf: настройки Postgres платформы обучения ЦРП.
# Сервер слушает только localhost, подключение по TLS, пароли scram-sha-256.
listen_addresses = 'localhost'
ssl = on
password_encryption = scram-sha-256

# Медленные запросы в журнал; тексты запросов целиком (log_statement) не пишем: в них бывают ПДн.
log_min_duration_statement = 1000
log_statement = 'none'
log_line_prefix = '%m [%p] %u@%d '

# shared_buffers: около 25 % оперативной памяти (для 4 ГБ - 1GB). Задаёт оператор под свой сервер:
# shared_buffers = 1GB
