# /etc/postgresql/16/main/conf.d/crp.conf: настройки Postgres платформы обучения ЦРП.
# Сервер слушает только localhost, подключение по TLS, пароли scram-sha-256.
listen_addresses = 'localhost'
ssl = on
password_encryption = scram-sha-256

# Медленные запросы в журнал; тексты запросов целиком (log_statement) не пишем: в них бывают ПДн.
log_min_duration_statement = 1000
log_statement = 'none'
# Значения параметров запроса (email, ФИО, хэши) в журнал не пишем ни в медленных запросах, ни при ошибках.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
# terse убирает из журнала строки DETAIL с ключами («Key (email)=(...) already exists»).
log_error_verbosity = terse
log_line_prefix = '%m [%p] %u@%d '

# shared_buffers: около 25 % оперативной памяти (для 4 ГБ - 1GB). Задаёт оператор под свой сервер:
# shared_buffers = 1GB
