<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ЦРП</title>
<!-- Приложение в этот момент не отвечает, поэтому тексты не из messages/: единственное исключение (D-027).
     Казахский текст требует проверки носителем (#13). Внешних ресурсов нет. -->
<style>
  :root { --board: #F3F4F1; --ink: #14161B; --ink-2: #4A4F59; --line: #DCDED8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--board); color: var(--ink);
         font: 400 17px/1.55 Onest, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }
  .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: 0.02em; margin: 0 0 2.5rem; }
  section { border-top: 1px solid var(--line); padding: 1.5rem 0; }
  h1 { font-size: 1.375rem; line-height: 1.3; font-weight: 600; margin: 0 0 0.5rem; }
  p { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <p class="brand">ЦРП</p>
  <section lang="ru">
    <h1 data-key="title">Платформа обучения ЦРП временно недоступна</h1>
    <p data-key="body">Идут технические работы. Обновите страницу через несколько минут.</p>
  </section>
  <section lang="kk">
    <h1 data-key="title">ЦРП оқу платформасы уақытша қолжетімсіз</h1>
    <p data-key="body">Техникалық жұмыстар жүріп жатыр. Бірнеше минуттан кейін бетті жаңартыңыз.</p>
  </section>
</main>
</body>
</html>
