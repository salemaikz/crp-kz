name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверки и e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    # Настоящий Postgres 16 для интеграционных тестов: блокировки (FOR UPDATE) и гонки
    # параллельных транзакций на PGlite (одно соединение) не проверить. Только для тестов.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crp
          POSTGRES_PASSWORD: crp
          POSTGRES_DB: crp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crp -d crp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Unit-тесты
        run: npm run test:unit

      - name: Интеграционные тесты (PGlite)
        run: npm run test:integration

      # Те же тесты на Postgres 16: каждая тестовая БД — своя временная схема (src/lib/db/testing.ts).
      # Тесты гонок (checkout-concurrency) без TEST_DATABASE_URL пропускаются — здесь они идут.
      - name: Интеграционные тесты (Postgres 16)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://crp:crp@localhost:5432/crp_test

      # next build/start — production: демо-режим (PGlite с сидом) только по явному DEMO_MODE=1.
      # На шагах тестов флаг не задан: тесты сами переключают режимы через окружение.
      - name: Сборка
        run: npm run build
        env:
          DEMO_MODE: '1'

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          PW_SKIP_BUILD: '1'
          DEMO_MODE: '1'

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
