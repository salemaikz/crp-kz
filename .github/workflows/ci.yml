name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Проверки и e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # демо-режим: без DATABASE_URL работает PGlite с сидом
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Unit-тесты
        run: npm run test:unit

      - name: Интеграционные тесты
        run: npm run test:integration

      - name: Сборка
        run: npm run build

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
        env:
          PW_SKIP_BUILD: '1'

      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
