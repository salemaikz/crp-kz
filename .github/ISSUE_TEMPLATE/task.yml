name: Задача
description: Единица работы — одна задача, одна ветка, один PR
title: "[lms] Короткое описание результата"
labels: ["stream:lms"]
body:
  - type: markdown
    attributes:
      value: |
        Перед созданием проверь `docs/WORKSTREAMS.md` и поищи похожие issues.
        Не пиши сюда секреты, ПДн и коммерческие условия — репозиторий публичный.
        **После создания поставь метки** `tier:*` и `phase:*` по выбранным ниже
        значениям — форма не умеет ставить их сама.
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - "курсы, уроки, тесты"
        - "доступ и оплата"
        - "компании и сотрудники"
        - "админка и конструктор"
        - "бренд и дизайн"
        - "инфраструктура и CI"
        - "правила и агенты"
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: "Уровень сложности (кому отдавать — docs/agents/ROUTING.md)"
      description: "Деньги, доступы, ПДн, схема БД, файлы — всегда T2 или T2→T1. Сомневаешься — ставь выше."
      options:
        - "T0 — Haiku — поиск, механика, документация по фактам"
        - "T1 — Sonnet — реализация по ТЗ, тесты"
        - "T2→T1 — дизайн и ревью Opus, реализация Sonnet"
        - "T2 — Opus — архитектура, деньги, доступы, безопасность, решения"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Этап (docs/lms/ROADMAP.md)
      options:
        - "phase:0-foundation"
        - "phase:1-employees"
        - "phase:2-sales"
        - "phase:3-b2b"
        - "phase:ops"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что должно получиться, одним-двумя предложениями.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Раздел SPEC, решения из DECISIONS, связанные issues, пути к коду.
  - type: textarea
    id: scope
    attributes:
      label: Границы
      description: Какие папки можно менять, что точно не трогать.
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
      description: Проверяемые критерии — тесты, сценарии, что видно в интерфейсе.
    validations:
      required: true
  - type: textarea
    id: owner_questions
    attributes:
      label: Вопросы владельцу
      description: Решения, без которых задачу не закончить (с рекомендуемым ответом).
